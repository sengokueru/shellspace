name: Bug report
description: Report a reproducible problem in ShellSpace
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows 10/11
        - macOS Apple Silicon
        - macOS Intel
    validations:
      required: true
  - type: input
    id: host
    attributes:
      label: DAW and version
      placeholder: Cubase 14.0.10
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: Plugin format
      options: [VST3, Audio Unit]
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the selected body, material, kit, and relevant control values.
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Logs, screenshots, or audio examples
      description: Drag files here. Remove private project data before uploading.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  VERSION: 0.4.0
  PLUGINVAL_VERSION: v1.0.4

jobs:
  build:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS universal
            slug: macos
          - os: windows-latest
            label: Windows x64
            slug: windows

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate and verify IR files
        shell: bash
        run: |
          python -m pip install --upgrade pip numpy
          python IR/make_ir.py IR
          python IR/verify_ir.py IR

      - name: Cache JUCE
        uses: actions/cache@v4
        with:
          path: ShellSpace/build/_deps
          key: juce-${{ matrix.slug }}-7dda739b9be09f1dfb9592a09e1701acf808cd44

      - name: Configure
        run: >
          cmake -B ShellSpace/build -S ShellSpace
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_PATH=fetch
          -DSS_COPY_AFTER_BUILD=OFF

      - name: Build
        run: cmake --build ShellSpace/build --config Release --parallel 3

      - name: Run DSP tests
        shell: bash
        run: |
          exe=$(find ShellSpace/build -type f \
                \( -name 'ShellSpaceDspTest' -o -name 'ShellSpaceDspTest.exe' \) \
                -not -path '*/_deps/*' | head -1)
          test -n "$exe"
          "$exe"

      - name: Collect products
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p dist/IR
          find ShellSpace/build -maxdepth 8 -name 'ShellSpace.vst3' -not -path '*/_deps/*' \
            -exec cp -R {} dist/ \; -quit
          test -e dist/ShellSpace.vst3
          if [ "${{ matrix.slug }}" = "macos" ]; then
            find ShellSpace/build -maxdepth 8 -name 'ShellSpace.component' -not -path '*/_deps/*' \
              -exec cp -R {} dist/ \; -quit
            test -e dist/ShellSpace.component
          fi
          cp IR/*.wav dist/IR/
          cp README.md dist/
          cp ShellSpace/check-install.ps1 dist/

      - name: Validate VST3 with pluginval
        shell: bash
        run: |
          set -euxo pipefail
          if [ "${{ matrix.slug }}" = "macos" ]; then
            curl -sL -o pluginval.zip \
              "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_macOS.zip"
            unzip -q pluginval.zip
            validator="./pluginval.app/Contents/MacOS/pluginval"
          else
            curl -sL -o pluginval.zip \
              "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/pluginval_Windows.zip"
            unzip -q pluginval.zip
            validator="./pluginval.exe"
          fi
          for seed in 1 2 5; do
            "$validator" --strictness-level 10 --validate-in-process \
              --random-seed "$seed" --timeout-ms 900000 \
              --validate dist/ShellSpace.vst3
          done

      - name: Validate Audio Unit
        if: matrix.slug == 'macos'
        run: |
          set -euxo pipefail
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/ShellSpace.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          sleep 3
          auval -v aufx Shsp Ysku

      - name: Build Windows installer and portable zip
        if: matrix.slug == 'windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' `
            "/DSourceDir=$pwd\dist" `
            "/DAppVersion=$env:VERSION" `
            'installer\ShellSpace.iss'
          Compress-Archive -Path 'dist\ShellSpace.vst3','dist\IR','dist\README.md','dist\check-install.ps1' `
            -DestinationPath "dist\ShellSpace-$env:VERSION-Windows-x64.zip"
          Move-Item "installer\ShellSpace-$env:VERSION-Setup.exe" dist\

      - name: Build macOS installer and portable zip
        if: matrix.slug == 'macos'
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p pkgroot/vst3 pkgroot/au pkgparts
          cp -R dist/ShellSpace.vst3 pkgroot/vst3/
          cp -R dist/ShellSpace.component pkgroot/au/
          pkgbuild --root pkgroot/vst3 \
                   --identifier com.yokosuka.shellspace.vst3 \
                   --version "$VERSION" \
                   --install-location /Library/Audio/Plug-Ins/VST3 \
                   pkgparts/vst3.pkg
          pkgbuild --root pkgroot/au \
                   --identifier com.yokosuka.shellspace.au \
                   --version "$VERSION" \
                   --install-location /Library/Audio/Plug-Ins/Components \
                   pkgparts/au.pkg
          cat > distribution.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <installer-gui-script minSpecVersion="2">
            <title>ShellSpace</title>
            <options customize="always" require-scripts="false" hostArchitectures="arm64,x86_64"/>
            <choices-outline>
              <line choice="vst3"/>
              <line choice="au"/>
            </choices-outline>
            <choice id="vst3" title="VST3" description="Cubase, Studio One, Live and compatible hosts">
              <pkg-ref id="com.yokosuka.shellspace.vst3"/>
            </choice>
            <choice id="au" title="Audio Unit" description="Logic Pro and GarageBand">
              <pkg-ref id="com.yokosuka.shellspace.au"/>
            </choice>
            <pkg-ref id="com.yokosuka.shellspace.vst3">vst3.pkg</pkg-ref>
            <pkg-ref id="com.yokosuka.shellspace.au">au.pkg</pkg-ref>
          </installer-gui-script>
          XML
          productbuild --distribution distribution.xml \
                       --package-path pkgparts \
                       "dist/ShellSpace-${VERSION}-macOS.pkg"
          ditto -c -k --sequesterRsrc --keepParent dist/ShellSpace.vst3 \
            "dist/ShellSpace-${VERSION}-macOS-VST3.zip"
          ditto -c -k --sequesterRsrc --keepParent dist/ShellSpace.component \
            "dist/ShellSpace-${VERSION}-macOS-AU.zip"

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: ShellSpace-${{ env.VERSION }}-${{ matrix.slug }}
          path: |
            dist/*.exe
            dist/*.pkg
            dist/*.zip
          if-no-files-found: error
